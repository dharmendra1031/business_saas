name: Generate Migration (Temporary)

on:
  push:
    paths:
      - 'backend/BusinessSaas.Api/Data/AppDbContextFactory.cs'
      - '.github/workflows/generate-migration.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/BusinessSaas.Api/BusinessSaas.Api.csproj
      - name: Install EF CLI and generate initial migration
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations add InitialCreate --project backend/BusinessSaas.Api/BusinessSaas.Api.csproj --startup-project backend/BusinessSaas.Api/BusinessSaas.Api.csproj --output-dir Data/Migrations
      - name: Emit migration sources for review
        run: |
          python3 - <<'PY'
          import json, pathlib
          paths = sorted(pathlib.Path("backend/BusinessSaas.Api/Data/Migrations").glob("*.cs"))
          for path in paths:
              print("MIGRATION_FILE_BEGIN " + path.as_posix())
              print(json.dumps(path.read_text()))
              print("MIGRATION_FILE_END")
          PY
