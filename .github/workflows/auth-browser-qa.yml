name: Auth Browser QA

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'frontend/web/src/**'
      - 'frontend/web/scripts/auth-browser-qa.mjs'
      - '.github/workflows/auth-browser-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser test runner temporarily
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start frontend and run mocked-API browser QA
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/business-ui-vite.log" 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ > /dev/null
          node scripts/auth-browser-qa.mjs
      - name: Upload desktop/mobile screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-browser-screenshots
          path: frontend/web/qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
