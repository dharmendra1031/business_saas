name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and integration tests
        run: dotnet test backend/BusinessSaas.Tests/BusinessSaas.Tests.csproj --configuration Release

  sql-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          password="Aa9!$(openssl rand -hex 18)"
          echo "::add-mask::$password"
          docker run -d --name business-saas-sql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            -p 127.0.0.1:14333:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          ready=0
          for attempt in $(seq 1 70); do
            if docker logs business-saas-sql 2>&1 | grep -q 'SQL Server is now ready for client connections'; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' business-saas-sql)" != "true" ]; then
              docker logs business-saas-sql
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs business-saas-sql
            exit 1
          fi
          echo "SQLSERVER_TEST_CONNECTION=Server=127.0.0.1,14333;Database=BusinessSaasCi;User Id=sa;Password=$password;Encrypt=True;TrustServerCertificate=True;Connect Timeout=15" >> "$GITHUB_ENV"
      - name: SQL Server migration and tenant integration test
        run: dotnet test backend/BusinessSaas.Tests/BusinessSaas.Tests.csproj --configuration Release --filter "Database=SqlServer"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
